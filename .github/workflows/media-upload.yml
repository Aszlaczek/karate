name: Upload mediów do R2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Przygotowanie 480p i posterów
        run: npm run media:prepare

      - name: Upload do R2
        run: npm run media:upload

      - name: Usunięcie nieużywanych obiektów
        run: npm run media:cleanup -- --apply

      - name: Aktualizacja manifestu
        run: npm run media:manifest

      - name: Audyt danych
        run: npm run audit

      - name: Sprawdzenie URL-i na R2
        run: npm run media:check-remote

      - name: Commit manifestu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/media.json
          if git diff --cached --quiet; then
            echo "Manifest bez zmian."
          else
            git commit -m "chore: odśwież manifest mediów z R2"
            git push
          fi
